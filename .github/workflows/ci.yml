name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55439/ledger_test?schema=public
      AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55439/ledger_test?schema=public
      JWT_SECRET: isolated-ci-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - run: npm test
      - run: npm run build
